# Numen - self-improving GPU deployment. The SAME image as docker-compose.yml, but
# run under the supervisor: it can rewrite, verify (sandboxed gate), and hot-swap
# its own kernel. Higher privilege - source writable, seccomp off (for the gate's
# user-namespace sandbox), no read-only root. Run it only when self-modification is
# intended, behind NUMEN_API_TOKEN, and arm NUMEN_AUTONOMOUS_IMPROVE on purpose.
#
# It shares the numen-data volume and port 8080 with the everyday service, so stop
# that one first:  docker compose down  &&  docker compose -f docker-compose.selfimprove.yml up -d
services:
  numen-selfimprove:
    build:
      context: .
    image: numen:0.1.0
    container_name: numen-selfimprove
    restart: unless-stopped
    # The supervisor is the entrypoint here (the image defaults to the plain kernel).
    entrypoint: ["/app/numen-supervisor"]
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      NUMEN_DB_PATH: /data/numen.db
      NUMEN_BIND: 0.0.0.0:8080
      NUMEN_CONSOLIDATE_TICK_SECS: ${NUMEN_CONSOLIDATE_TICK_SECS:-300}
      NUMEN_IDLE_SECS: ${NUMEN_IDLE_SECS:-60}
      NUMEN_PROACTIVE: ${NUMEN_PROACTIVE:-0}
      NUMEN_FEEDS: ${NUMEN_FEEDS:-}
      NUMEN_MODEL_PATH: ${NUMEN_MODEL_PATH:-/models/Qwen3-30B-A3B-Q4_K_M.gguf}
      NUMEN_EMBED_MODEL_DIR: ${NUMEN_EMBED_MODEL_DIR:-/models/all-MiniLM-L6-v2}
      # Wire the workshop: this is what takes self-improvement out of dormancy.
      NUMEN_SRC_DIR: /app/src
      # The gate rebuilds with the cuda feature, so a self-deploy keeps GPU inference.
      NUMEN_BUILD_FEATURES: cuda
      # The autonomous loop (critique -> improve -> deploy). Off by default; arm it
      # deliberately. Requires NUMEN_API_TOKEN and CLAUDE_CODE_OAUTH_TOKEN.
      NUMEN_AUTONOMOUS_IMPROVE: ${NUMEN_AUTONOMOUS_IMPROVE:-0}
      NUMEN_DASHBOARD: /app/dashboard.html
    volumes:
      - numen-data:/data
      - "${NUMEN_MODELS_DIR:-/tmp/numen-models}:/models:ro"
      - "./src/dashboard.html:/app/dashboard.html:ro"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # bubblewrap (the gate sandbox) must create a user namespace, which Docker's
    # default seccomp blocks. The inner gate sandbox (no network, read-only root) is
    # what contains the untrusted build; the outer container relaxing seccomp is the
    # accepted trade for this dedicated, intentionally higher-privilege mode.
    security_opt:
      - seccomp=unconfined
    # NOT read_only: the supervisor builds in /app/src and swaps the binary at /app.
    pids_limit: 1024
    cpus: "12.0"
    mem_limit: 32g

volumes:
  numen-data:
